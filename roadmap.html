  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<body data-page="roadmap">
  <div id="site-header"></div>
  <main id="main">
    <header class="board page-head">
      <div class="wrap">
        <h1>Eight phases, from breadboard to 120 metres</h1>
        <p class="lede">At 3 to 5 hours a week, the first stable hover lands at the end of March 2027. The circuit board gets designed while I tune, and altitude hold follows in the summer. Each phase has a clear test for when it's done.</p>
      </div>

      <div class="wrap">
        <h2 style="font-size:var(--step-3)">Timeline</h2>
        <div id="gantt"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2 style="font-size:var(--step-3);margin-bottom:2rem">Phase by phase</h2>

      </div>

  <div id="site-footer"></div>
